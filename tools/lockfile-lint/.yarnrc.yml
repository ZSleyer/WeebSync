# Same Yarn and the same safety settings as the frontend: this tree is
# installed BEFORE the frontend lockfile has been checked, so it must come
# from its own pinned lockfile, with the 7-day age gate and no install scripts.
yarnPath: ../../frontend/.yarn/releases/yarn-4.18.1.cjs
nodeLinker: node-modules
npmMinimalAgeGate: 7d
enableScripts: false
approvedGitRepositories: []
enableTelemetry: false
