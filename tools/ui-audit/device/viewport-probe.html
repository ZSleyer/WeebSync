<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- deliberately identical to the app's own tag: safe-area insets are only
         reported when the page asks to be laid out under the system bars -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Viewport probe - WeebSync</title>
    <style>
      :root {
        color-scheme: dark;
        --ground: #0d0f14;
        --panel: #151922;
        --line: #262c3a;
        --ink: #e6e9f0;
        --muted: #8a92a6;
        --accent: #a78bfa;
        --warn: #f0b429;
        --ok: #4ade80;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      /* the experiment itself: one dynamic viewport of height. If the footer
         does not touch the bottom of the screen, the unit is not describing
         what the user can see. */
      .frame {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--ground);
        color: var(--ink);
        font: 15px/1.5 system-ui, sans-serif;
      }
      header {
        flex: 0 0 auto;
        padding: 0.75rem 1rem;
        padding-top: calc(0.75rem + env(safe-area-inset-top));
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
      }
      h1 { margin: 0; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
      header span { font-size: 0.72rem; color: var(--muted); }
      main { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 1rem; }
      .verdict { margin: 0 0 1rem; padding: 0.7rem 0.85rem; border-left: 3px solid var(--accent); background: var(--panel); font-size: 0.9rem; }
      .verdict b { color: var(--accent); }
      dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 0.35rem 1rem; font-variant-numeric: tabular-nums; }
      dt { font-size: 0.82rem; color: var(--muted); }
      dd { margin: 0; font-family: ui-monospace, monospace; font-size: 0.9rem; text-align: right; }
      dd.flag { color: var(--warn); }
      dd.good { color: var(--ok); }
      h2 { margin: 1.4rem 0 0.5rem; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 0.3rem; }
      /* stand-in for the app's tab bar - the row whose position is in question */
      footer {
        flex: 0 0 auto;
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 0.6rem 1rem;
        padding-bottom: calc(0.6rem + env(safe-area-inset-bottom));
        display: flex;
        justify-content: space-between;
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
      }
      #peak { margin-top: 0.6rem; font-size: 0.8rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <h1>Viewport probe</h1>
        <span id="tick">measuring…</span>
      </header>

      <main>
        <p class="verdict" id="verdict">Scroll up and down here until the URL bar retracts, then back up.</p>

        <h2>Window</h2>
        <dl id="win"></dl>

        <h2>Viewport units</h2>
        <dl id="units"></dl>

        <h2>Visual viewport</h2>
        <dl id="vv"></dl>

        <h2>Safe-area insets</h2>
        <dl id="safe"></dl>

        <h2>Document</h2>
        <dl id="doc"></dl>

        <p id="peak"></p>
      </main>

      <footer>
        <span>Bottom edge of the 100dvh box</span>
        <b id="gap">–</b>
      </footer>
    </div>

    <script src="viewport-probe.js"></script>
  </body>
</html>
