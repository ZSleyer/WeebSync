# What the linter is for here: catching real defects that `go vet` misses.
# Style opinions are deliberately out - they generate diff noise nobody asked
# for and drown the findings that matter.
version: "2"

linters:
  default: standard # govet, staticcheck, unused, ineffassign, errcheck
  enable:
    # database/sql: a Rows loop that never checks rows.Err() treats a
    # mid-iteration failure as "no more rows"; an unclosed Rows leaks a
    # connection
    - rowserrcheck
    - sqlclosecheck
    # an HTTP response body left open leaks the connection
    - bodyclose
    # `err == io.EOF` misses a wrapped error; errors.Is is the comparison
    # that survives a %w somewhere down the call chain
    - errorlint
    # the pre-1.22 `x := x` loop copy is dead weight now
    - copyloopvar
    # copy-pasted blocks over the threshold; clean today, kept as a ratchet
    - dupl
    # typos in identifiers and comments. No locale: the tree writes British
    # English on purpose (serialise, catalogue) and AniList's own enum values
    # (CANCELLED) must stay as the API spells them
    - misspell
    # gc may read a struct field twice when it copies the struct and checks
    # that field (seen on amd64 and arm64 with Go 1.27): once for the copy,
    # once for the check. That is only a TOCTOU when someone outside the
    # goroutine can write the source memory mid-copy. With no unsafe and no
    # mmap, the only writer like that is a data race, and `go test -race`
    # catches those. These two keep it that way.
    - depguard
    - forbidigo
    # security patterns at lint time: a server without a header timeout,
    # InsecureSkipVerify, math/rand for a token, weak hashes, decompression
    # without a cap. The rules it cannot judge here are excluded below
    - gosec
  # nilerr is deliberately absent: every place it reports swallows an error
  # on purpose (an unreadable entry in a WalkDir, the last admin kept) and
  # says so in a comment.
  settings:
    staticcheck:
      checks:
        - all
        - -ST* # naming and doc-comment style
        - -QF* # refactoring suggestions (tagged switch, De Morgan)
    dupl:
      threshold: 150
    depguard:
      rules:
        main:
          deny:
            - pkg: unsafe
              desc: memory the Go memory model does not cover; see the depguard note above
    gosec:
      excludes:
        - G104 # unchecked errors: the errcheck note above
        - G101 # hardcoded credentials: it flags names (setupTokenHeader); gitleaks scans for real secrets
        - G115 # integer conversions: the ones on file input are in mkvsubs, which is fuzzed
        - G124 # cookie flags: every cookie goes through auth.SetCookie, which gosec cannot see into
        - G202 # SQL concatenation: only WHERE clauses built from literals, values stay placeholders
        - G701 # SQL taint: same, plus CodeQL's go/sql-injection runs on every push
        - G204 # subprocess with variable: ffmpeg/ffprobe get an argument list, never a shell,
        - G702 #   the input behind -i as an fd or loopback URL, under ffCommand's whitelists
        - G304 # file path from variable: local paths are opened through os.Root
        - G703 # path taint: same
        - G704 # SSRF taint: outbound requests go through netguard
        - G301 # directory 0755: the media trees are shared with other add-ons and Plex
        - G306 # file 0644: same
    forbidigo:
      forbid:
        - pattern: ^(syscall|unix)\.Mmap$
          msg: a shared mapping can change under a copy; read the file with os/io instead
  exclusions:
    paths:
      # generated Swagger output and the bundled Swagger UI
      - docs
    rules:
      # errcheck policy: see the note on the errcheck exclusions below.
      # Teardown and best-effort output stay out of scope: a Close (files,
      # connections, rows, response bodies, transactions already committed),
      # a write to an http.ResponseWriter or a log/terminal stream, a
      # fire-and-forget syscall on a connection that is going away anyway.
      # What errcheck keeps checking is state that matters: database writes
      # and reads (Exec, Scan, SetSetting, persistMatch), json decoding of
      # stored data, file writes/renames/removals, and calls to our own
      # services. A deliberate ignore there is written `_ = f()` with the
      # reason next to it, not added to this list.
      - linters:
          - errcheck
        text: "Error return value of `[^`]*\\.(Close|Rollback|Serve|Quit|SetDeadline|SetWriteDeadline|Reject|Reply|WriteString|Write|PrintfLine)` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `(fmt\\.(Fprint|Fprintf|Fprintln)|io\\.WriteString|binary\\.Write)` is not checked"
      # Not triaged yet (about 55 sites): json decoding of stored data, os
      # removals and chtimes, directory walks, calls into the metadata
      # providers and the transfer manager. Each is a candidate for the same
      # treatment as the database calls; take a class off this list, fix or
      # mark its findings, repeat.
      - linters:
          - errcheck
        text: "Error return value of `(s\\.(Tvdb|Tmdb|Anilist|Transfers|Push)\\.[A-Za-z]+|s\\.(trashFile|startMediaJob)|json\\.Unmarshal|\\(\\*encoding/json\\.Decoder\\)\\.Decode|os\\.(Remove|RemoveAll|Chtimes)|local\\.Root\\.[A-Za-z]+|fs\\.WalkDir|filepath\\.WalkDir|provider\\.Claims|xml\\.EscapeText|unix\\.IoctlSetTermios|\\(\\*os/exec\\.Cmd\\)\\.Run)` is not checked"
      # tests repeat themselves by design
      - path: _test\.go
        linters:
          - errcheck
          - dupl
          - bodyclose
          - gosec

formatters:
  enable:
    - gofmt
