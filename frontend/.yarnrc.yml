# Yarn itself is checked in and run through yarnPath: the node images dropped
# corepack with node 25, and a global yarn 1 hands over to this file.
yarnPath: .yarn/releases/yarn-4.18.1.cjs

# a plain node_modules tree: the design system borrows it through a symlink,
# and Vite's native binaries expect it
nodeLinker: node-modules

# A version is a week old before it can be installed, the same window as the
# Dependabot cooldown: the hijacked releases of the npm worm waves were pulled
# within days. Set explicitly - converting an older lockfile writes 0 here.
npmMinimalAgeGate: 7d

# Install scripts are where npm malware runs. The one dependency that has one
# (lfa-ponyfill, via jassub) only re-fetches a font list its tarball already
# ships. Explicit for the same reason as the age gate.
enableScripts: false
approvedGitRepositories: []

enableTelemetry: false
