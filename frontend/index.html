<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- interactive-widget: without it only the visual viewport shrinks when the
         on-screen keyboard opens, so the layout - and the tab bar with it -
         stays behind the keyboard. Chrome 108+, Firefox 132+, ignored elsewhere. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- the bars, not the page: this tints the browser's own chrome, and the
         seam is invisible only if it matches what we draw against it (--bg-2).
         One per OS scheme until the script runs; theme.ts then sets both to the
         theme actually chosen -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05070d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>WeebSync</title>
    <meta name="description" content="WeebSync holds your anime, manga and files in sync with your servers: what is new today, what needs you, and what airs next." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
