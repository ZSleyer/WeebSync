name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: backend
      - name: test
        run: go test -race ./...
      - name: openapi spec in sync
        run: |
          ./gen-docs.sh
          git diff --exit-code docs/ \
            || { echo "OpenAPI spec out of date - run backend/gen-docs.sh and commit docs/"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
        # the design system has no dependency tree of its own and borrows the
        # app's, the same link design-system/build.sh makes. Without it tsc
        # cannot resolve React's types from design-system/src and every prop
        # degrades to any, which fails the build.
      - name: link the design system to the app's modules
        run: ln -sfn "$PWD/node_modules" ../design-system/node_modules
      - name: lint (oxlint)
        run: yarn lint
      - name: test (vitest)
        run: yarn test
      - name: build (tsc + vite)
        run: yarn build

  # dev image: every green main build lands on ghcr as :dev, and the HA add-on
  # follows that tag. The nightly channel stays alongside for anyone who wants
  # at most one update a day; :dev is the fast lane while a change is being
  # worked on. The nightly cleanup excludes :dev by name - see nightly.yml.
  dev-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-{{sha}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            CHANNEL=dev
            COMMIT=${{ github.sha }}
            REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Poke the add-on so it picks the new digest up right away instead of
      # waiting for its own poll. No-op there if the digest is unchanged.
      - name: Notify add-on repo
        continue-on-error: true # the add-on's cron still catches it
        env:
          GH_TOKEN: ${{ secrets.ADDON_DISPATCH_TOKEN }}
        run: gh api repos/ZSleyer/WeebSync-Addon/dispatches -f event_type=upstream-image
