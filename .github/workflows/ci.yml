name: ci

on:
  # Every branch, not just main. The house rule is that work is pushed as a
  # feature branch and merged from the desktop rather than through a pull
  # request, so gating on main meant the gates first ran after the merge - and
  # `go test -race` runs NOWHERE else: the second workstation is a Raspberry
  # Pi whose kernel has 47 VA bits where ThreadSanitizer needs 48, so every
  # local run aborts with "unsupported VMA range".
  #
  # Nothing is published from a branch: the dev-image job below still checks
  # for refs/heads/main, so ghcr's :dev tag - the one the add-on follows - only
  # ever moves on a green main build.
  push:
  pull_request:

# A branch under active work is pushed often, and a full run costs ten minutes
# of govulncheck, trivy and a docker build. Superseded runs are cancelled -
# except on main, where the run publishes :dev and has to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend
      - name: test
        run: go test -race ./...
      - name: fuzz the Matroska parser
        # it reads files off remote servers, on worker goroutines whose panic
        # ends the process. A short run per target catches what a change broke;
        # the long hunts are local (see internal/mkvsubs/fuzz_test.go)
        run: |
          for t in FuzzRead FuzzKeyframes FuzzAttachments; do
            go test -run '^$' -fuzz "^$t\$" -fuzztime 20s ./internal/mkvsubs || exit 1
          done
      - name: reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: openapi spec in sync
        run: |
          ./gen-docs.sh
          git diff --exit-code docs/ \
            || { echo "OpenAPI spec out of date - run backend/gen-docs.sh and commit docs/"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: lockfile sources
        # every package must resolve through the registry in .yarnrc.yml: a
        # lockfile edit in a diff nobody reads line by line could point one
        # at a tarball URL or a git repo, and the install takes it as written
        run: npx --yes lockfile-lint@5.0.1 --path yarn.lock --type yarn --allowed-schemes "npm:" "patch:" "workspace:"
      - run: yarn install --immutable
        # the design system has no dependency tree of its own and borrows the
        # app's, the same link design-system/build.sh makes. Without it tsc
        # cannot resolve React's types from design-system/src and every prop
        # degrades to any, which fails the build.
      - name: link the design system to the app's modules
        run: ln -sfn "$PWD/node_modules" ../design-system/node_modules
      - name: lint (oxlint)
        run: yarn lint
      - name: format (oxfmt)
        run: yarn format:check
      - name: api types in sync
        run: |
          yarn gen:api
          git diff --exit-code src/api.gen.ts \
            || { echo "API types out of date - run backend/gen-docs.sh, then yarn gen:api, and commit src/api.gen.ts"; exit 1; }
      - name: test (vitest)
        run: yarn test
      - name: production dependency audit
        run: yarn npm audit --recursive --environment production --no-deprecations
      - name: build (tsc + vite)
        run: yarn build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: secret scan
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          detect --source=/repo --no-banner --redact --log-opts=--all
      - name: workflow audit
        # template injection, credentials left in the checkout, broad tokens
        run: pipx run zizmor==1.31.0 --offline .github/workflows
      - name: Dockerfile audit
        # running as root, unpinned bases, ADD of remote URLs, sudo in RUN
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
          config --severity HIGH,CRITICAL --exit-code 1 /repo
      - name: build image
        run: docker build --pull -t weebsync-ci .
      - name: image vulnerability scan
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.67.2@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 weebsync-ci

  # dev image: every green main build lands on ghcr as :dev, and the HA add-on
  # follows that tag. The nightly channel stays alongside for anyone who wants
  # at most one update a day; :dev is the fast lane while a change is being
  # worked on. The nightly cleanup excludes :dev by name - see nightly.yml.
  dev-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore certificate for the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-{{sha}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # an SPDX list of every package in the image, beside the provenance
          # a public repo gets by default
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            CHANNEL=dev
            COMMIT=${{ github.sha }}
            REPO=${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # signed SLSA provenance in GitHub's attestation store, checkable with
      # `gh attestation verify oci://ghcr.io/zsleyer/weebsync@<digest> -R ZSleyer/WeebSync`.
      # Not pushed to ghcr: the nightly prune would sweep the referrers, and
      # storage records exist for organisation repos only
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/zsleyer/weebsync
          subject-digest: ${{ steps.build.outputs.digest }}
          create-storage-record: false
      # Poke the add-on so it picks the new digest up right away instead of
      # waiting for its own poll. No-op there if the digest is unchanged.
      - name: Notify add-on repo
        continue-on-error: true # the add-on's cron still catches it
        env:
          GH_TOKEN: ${{ secrets.ADDON_DISPATCH_TOKEN }}
        run: gh api repos/ZSleyer/WeebSync-Addon/dispatches -f event_type=upstream-image
