name: release

# Releases follow the Home Assistant scheme: YEAR.MONTH.N - a month's
# release is .0, every fix after it counts up (2026.10.0, 2026.10.1,
# 2026.11.0). workflow_dispatch rebuilds an existing tag with this
# workflow, for a tag whose own commit predates it.
on:
  push:
    tags: ["20[0-9][0-9].*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag to build, e.g. 2026.10.0"
        required: true
      moving:
        description: "also move :latest and the month's line (no for an older release)"
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      # tag name flows into the -ldflags build-arg; reject anything that isn't
      # strictly YEAR.MONTH.N so a hostile tag can't inject linker flags. TAG
      # via env (not ${{ }} inlined into the script) so the tag can't inject
      # shell.
      - name: Validate tag is YEAR.MONTH.N
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^20[0-9]{2}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag '$TAG' is not YEAR.MONTH.N (e.g. 2026.10.0)"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - name: Commit of the tag
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # latest only where the tags below say so: the default (auto) adds
          # it to every semver build, an older release rebuilt included
          flavor: latest=false
          # YEAR.MONTH.N reads as semver: the exact release, and the month's
          # line (2026.10) that moves with its fixes
          # the tag's commit, not the run's: a dispatched rebuild runs on
          # main, and the default label then named main's head
          labels: |
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.tag }},enable=${{ inputs.moving != 'no' }}
            type=raw,value=latest,enable=${{ inputs.moving != 'no' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
            CHANNEL=stable
            COMMIT=${{ steps.sha.outputs.sha }}
            REPO=${{ github.repository }}
      # Poke the HA add-on so it picks the new digest up right away. No-op on
      # the add-on side unless it tracks a tag this release moved.
      - name: Notify add-on repo
        continue-on-error: true # the add-on's cron still catches it
        env:
          GH_TOKEN: ${{ secrets.ADDON_DISPATCH_TOKEN }}
        run: gh api repos/ZSleyer/WeebSync-Addon/dispatches -f event_type=upstream-image
