version: 2

# Version updates, on top of the security updates GitHub raises on its own.
# Everything is grouped: a lockfile bump per package is noise, one PR a week
# per ecosystem is a review.
#
# A version is a week old before it is proposed: the hijacked releases of the
# npm worm waves were pulled within days, and a week sits that out. Security
# updates ignore the cooldown and still come at once.
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # react and its types move together; a lone bump of one half fails to build
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      dev:
        dependency-type: development
        update-types: [minor, patch]
      prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tools/ui-audit
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      audit:
        patterns: ["*"]

  # the actions are pinned by commit sha, which is why they need updating at
  # all. Majors stay out of the group: they are the ones with a changelog to
  # read, and one PR each keeps them from hiding in a weekly bump
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # the base images are pinned by digest as well as by tag, so a rebuild
  # cannot pull in a different image than the one CI scanned; these PRs move
  # the digest along. A new major (node 27, alpine 3.25) comes on its own
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]
        update-types: [minor, patch]
