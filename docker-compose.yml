services:
  weebsync:
    build: .
    # image: ghcr.io/zsleyer/weebsync:nightly   # or :dev for every green push
    # optional: run as the owner of your media instead of the image's
    # nonroot (65532), so downloads land with your uid/gid. `./data` must be
    # owned by that user too (see README, "File ownership").
    # user: "1000:1000"
    # group_add:
    #   - "990"
    ports:
      # session auth runs over plain HTTP - bind to loopback and put a
      # TLS-terminating reverse proxy in front. Use "8080:8080" only on a
      # trusted host you fully control.
      - "127.0.0.1:8080:8080"
    environment:
      # timestamps in the container logs. The zone database is compiled into
      # the binary, so any IANA name works without installing tzdata.
      TZ: ${TZ:-UTC}
      # optional: key for credential encryption at rest. If unset, a key is
      # auto-generated at /data/secret.key on first start.
      # WEEBSYNC_SECRET: ${WEEBSYNC_SECRET}
      # optional: AniList API token (higher rate limit)
      # ANILIST_TOKEN: ""
      # optional: OIDC login (Authentik/Keycloak/…)
      # OIDC_ISSUER: https://auth.example.com/application/o/weebsync/
      # OIDC_CLIENT_ID: weebsync
      # OIDC_CLIENT_SECRET: "…"
      # OIDC_REDIRECT_URL: https://weebsync.example.com/api/auth/oidc/callback
      # optional: allowlist of local roots (":"-separated). Mount your media
      # wherever and list the mounts; only these are browsable/writable.
      # WEEBSYNC_DOWNLOADS: /media:/data/downloads
    volumes:
      - ./data:/data # sqlite db + default downloads (under /data/downloads)
      # mount media libraries as sync targets, then add them to
      # WEEBSYNC_DOWNLOADS above:
      # - /srv/media:/media
    restart: unless-stopped
